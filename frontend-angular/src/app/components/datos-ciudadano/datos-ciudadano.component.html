<div class="datos-ciudadano">
  <p class="kicker-seccion">Paso 1 de 2</p>
  <h2>Identifícate para iniciar el trámite</h2>
  <p class="texto-ayuda">
    Completa tus datos de identificación. Con ellos personalizamos esta sesión
    y te orientamos durante el registro.
  </p>

  <form (ngSubmit)="continuar()">
    <div class="campo">
      <label for="nombreCompleto">Nombre completo</label>
      <input
        id="nombreCompleto"
        type="text"
        name="nombreCompleto"
        [(ngModel)]="nombreCompleto"
        autocomplete="name"
        placeholder="Como aparece en tu documento"
      />
    </div>

    <div class="campo">
      <label for="identidad">Número de identidad</label>
      <input
        id="identidad"
        type="text"
        name="identidad"
        [(ngModel)]="identidad"
        inputmode="numeric"
        autocomplete="off"
        placeholder="0000-0000-00000"
      />
      <p class="pista-campo">Usa el formato de tu documento nacional de identidad.</p>
    </div>

    <div class="campo">
      <label for="ciudad">Municipio o ciudad</label>
      <input
        id="ciudad"
        type="text"
        name="ciudad"
        [(ngModel)]="ciudad"
        autocomplete="address-level2"
        placeholder="Ej. Tegucigalpa, Juticalpa, San Pedro Sula"
      />
    </div>

    <p class="error" *ngIf="error">{{ error }}</p>

    <button type="submit">Continuar al registro</button>
  </form>
</div>
